services:
  marker:
    build:
      context: .
      dockerfile: Dockerfile
      # GitHub Releases 可直连时，可把下面两行取消注释以使用官方预编译二进制
      # args:
      #   NPM_BETTER_SQLITE3_BINARY_HOST: ""
    image: garment-marker-layout:latest
    container_name: garment-marker
    ports:
      - "3000:3000"          # 宿主机端口:容器端口；如需改端口，改左边即可
    environment:
      PORT: "3000"
      DB_PATH: /app/data/marker.db
      # HOST: "0.0.0.0"
    volumes:
      - marker-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/layout').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  marker-data:
